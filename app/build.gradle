plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.flexi.worldclock'
    compileSdk 35

    defaultConfig {
        applicationId "com.flexi.worldclock"
        minSdk 31
        targetSdk 35
        // CI overrides these from the release tag, for example tag v0.1.0 -> versionCode 100.
                def releaseVersionCode = (findProperty('versionCode') ?: '100') as int
                def releaseVersionName = (findProperty('versionName') ?: '1.0') as String
                versionCode releaseVersionCode
                versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The release APK is signed outside Gradle by scripts/build.ps1 so that
    // v2 + v3 + v4 signatures (and the .idsig file) are produced explicitly.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig null
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// All sources are Kotlin; the Java target in compileOptions is kept only so the Java and Kotlin
// compilations agree on 17 (AGP fails the build when the two targets differ).
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // android.jar ships stubbed org.json methods, so the JVM tests need a real implementation.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}